[package]
name = "vector-db"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A compact HNSW vector index with pluggable storage backends"
license = "MIT"
repository = "https://github.com/src6/vector-db"

[dependencies]
rand = "0.8"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
memmap2 = "0.9"
