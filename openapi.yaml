openapi: 3.1.0
info:
  title: vector-db API
  version: 0.1.0
  description: >-
    A single-node HNSW vector search service. The vector dimension, distance
    metric, and graph parameters are selected when the server starts.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:3000
    description: Default local server
security: []
tags:
  - name: System
    description: Service health and index metadata.
  - name: Vectors
    description: Vector insertion and logical deletion.
  - name: Search
    description: Single and Rayon-backed batch nearest-neighbor search.
  - name: Maintenance
    description: Explicit index maintenance operations.
paths:
  /v1/health:
    get:
      tags: [System]
      summary: Check service liveness
      operationId: getHealth
      responses:
        "200":
          description: The process is accepting requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/stats:
    get:
      tags: [System]
      summary: Read index counts and configuration
      operationId: getStats
      responses:
        "200":
          description: Current index statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
  /v1/vectors:
    post:
      tags: [Vectors]
      summary: Insert one vector
      operationId: insertVector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertRequest"
      responses:
        "201":
          description: Vector inserted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          description: Request body exceeds 8 MiB.
  /v1/vectors/batch:
    post:
      tags: [Vectors]
      summary: Validate and insert a vector batch
      description: The complete batch is validated before any vector is inserted.
      operationId: insertVectorBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsertBatchRequest"
      responses:
        "201":
          description: Batch inserted. IDs correspond to input order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsertBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          description: Request body exceeds 8 MiB.
  /v1/vectors/{id}:
    delete:
      tags: [Vectors]
      summary: Logically delete a point
      description: >-
        Marks the point as deleted. Its graph node remains traversable until
        compaction, but the point is immediately excluded from search results.
      operationId: deleteVector
      parameters:
        - $ref: "#/components/parameters/PointId"
      responses:
        "204":
          description: Point deleted.
        "404":
          description: Point ID does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Point was already deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/search:
    post:
      tags: [Search]
      summary: Search for nearest neighbors
      operationId: search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Neighbors ordered by ascending distance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          description: Request body exceeds 8 MiB.
  /v1/search/batch:
    post:
      tags: [Search]
      summary: Search a query batch in parallel
      operationId: searchBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchBatchRequest"
      responses:
        "200":
          description: One ordered neighbor list per input query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchBatchResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "413":
          description: Request body exceeds 8 MiB.
  /v1/maintenance/compact:
    post:
      tags: [Maintenance]
      summary: Rebuild the index without tombstones
      description: >-
        Holds the write lock while rebuilding active points. Point IDs become
        dense and may change; clients must apply the returned mapping.
      operationId: compactIndex
      responses:
        "200":
          description: Compaction completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompactResponse"
        "500":
          description: The blocking index task failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    PointId:
      name: id
      in: path
      required: true
      description: Zero-based point identifier.
      schema:
        type: integer
        minimum: 0
  responses:
    InvalidRequest:
      description: Invalid vector, dimension, or search parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Vector:
      type: array
      minItems: 1
      items:
        type: number
        format: float
      example: [0.1, 0.2, 0.3]
    Metric:
      type: string
      enum: [L2, Cosine]
    Neighbor:
      type: object
      required: [id, distance]
      properties:
        id:
          type: integer
          minimum: 0
        distance:
          type: number
          format: float
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    StatsResponse:
      type: object
      required:
        - total_vectors
        - active_vectors
        - deleted_vectors
        - dimension
        - metric
        - m
        - m_max0
        - ef_construction
        - ef_search
      properties:
        total_vectors:
          type: integer
          minimum: 0
        active_vectors:
          type: integer
          minimum: 0
        deleted_vectors:
          type: integer
          minimum: 0
        dimension:
          type: integer
          minimum: 1
        metric:
          $ref: "#/components/schemas/Metric"
        m:
          type: integer
          minimum: 1
        m_max0:
          type: integer
          minimum: 1
        ef_construction:
          type: integer
          minimum: 1
        ef_search:
          type: integer
          minimum: 1
    InsertRequest:
      type: object
      required: [vector]
      properties:
        vector:
          $ref: "#/components/schemas/Vector"
    InsertResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          minimum: 0
    InsertBatchRequest:
      type: object
      required: [vectors]
      properties:
        vectors:
          type: array
          items:
            $ref: "#/components/schemas/Vector"
    InsertBatchResponse:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: integer
            minimum: 0
    SearchRequest:
      type: object
      required: [vector, k]
      properties:
        vector:
          $ref: "#/components/schemas/Vector"
        k:
          type: integer
          minimum: 1
    SearchResponse:
      type: object
      required: [neighbors]
      properties:
        neighbors:
          type: array
          items:
            $ref: "#/components/schemas/Neighbor"
    SearchBatchRequest:
      type: object
      required: [queries, k]
      properties:
        queries:
          type: array
          items:
            $ref: "#/components/schemas/Vector"
        k:
          type: integer
          minimum: 1
    SearchBatchResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/Neighbor"
    IdMapping:
      type: object
      required: [old_id, new_id]
      properties:
        old_id:
          type: integer
          minimum: 0
        new_id:
          type: integer
          minimum: 0
    CompactResponse:
      type: object
      required: [removed, id_map]
      properties:
        removed:
          type: integer
          minimum: 0
        id_map:
          type: array
          items:
            $ref: "#/components/schemas/IdMapping"
    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          examples:
            - invalid_request
            - point_not_found
            - point_already_deleted
            - internal_error
        message:
          type: string
